services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=autocontable
      - POSTGRES_USER=autocontable
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocontable"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgresql://autocontable:${POSTGRES_PASSWORD}@postgres:5432/autocontable
      - PYTHONPATH=/app
      - FRONTEND_URL=https://factpilot.fr
      - CORS_ORIGINS=https://factpilot.fr
      - SESSION_SECRET=${SESSION_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://factpilot.fr/api/auth/google/callback
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_REDIRECT_URI=https://factpilot.fr/api/auth/linkedin/callback
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_CABINET=${STRIPE_PRICE_CABINET}
      - STRIPE_PRICE_RESEAU=${STRIPE_PRICE_RESEAU}
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: .
    restart: always
    command: python -m src.scheduler.main
    environment:
      - DATABASE_URL=postgresql://autocontable:${POSTGRES_PASSWORD}@postgres:5432/autocontable
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_SITE_URL=https://factpilot.fr
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backup:
    build: .
    restart: always
    command: >
      sh -c "while true; do
        echo '[backup] Running daily backup...';
        /app/scripts/backup.sh;
        sleep 86400;
      done"
    environment:
      - DATA_DIR=/app/data
      - BACKUP_DIR=/app/backups
    volumes:
      - app-data:/app/data
      - backup-data:/app/backups

volumes:
  app-data:
  backup-data:
  postgres-data:
