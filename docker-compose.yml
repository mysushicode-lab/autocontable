version: '3.8'

services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///data/accounting.db
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - app-data:/app/data
    ports:
      - "8000:8000"

  scheduler:
    build: .
    restart: unless-stopped
    command: python -m src.scheduler.main
    environment:
      - DATABASE_URL=sqlite:///data/accounting.db
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - app-data:/app/data
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://carrosserie-erik.fr/api
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  app-data:
