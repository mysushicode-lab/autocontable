version: '3.8'

services:
  backend:
    build: .
    container_name: contamail-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///data/accounting.db
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - contamail-network

  scheduler:
    build: .
    container_name: contamail-scheduler
    restart: unless-stopped
    command: python -m src.scheduler.main
    environment:
      - DATABASE_URL=sqlite:///data/accounting.db
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    networks:
      - contamail-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contamail-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - contamail-network

  nginx:
    image: nginx:alpine
    container_name: contamail-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data:/app/data:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - contamail-network

  certbot:
    image: certbot/certbot
    container_name: contamail-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  contamail-network:
    driver: bridge
